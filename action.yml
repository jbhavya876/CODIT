name: "CODIT Guard"
description: "Authoritative PR diff verification gate for AI-written changes (rules AGT-001..012, secrets)."
inputs:
  fail-on:
    description: "Minimum severity to fail the check (critical, high, medium, never)"
    required: false
    default: "high"
  config:
    description: "Ignored in base-trusted PR checks (.codit.yml is read from base commit)"
    required: false
    default: ".codit.yml"
  upload-sarif:
    description: "Upload codit.sarif to GitHub Code Scanning when permissions allow"
    required: false
    default: "true"
  version:
    description: "Pinned codit-guard version"
    required: false
    default: "3.0.0"
  install-from:
    description: "Package source: pypi or github (uses git subdirectory until published on PyPI)"
    required: false
    default: "github"
  repo-ref:
    description: "Git ref or tag when install-from=github"
    required: false
    default: "v1"

runs:
  using: "composite"
  steps:
    # Note: Consume via `pull_request` event only. Never `pull_request_target` with PR checkout.
    # Pin upstream third-party actions by commit SHA in production workflows.
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"

    - name: Install codit-guard
      shell: bash
      run: |
        if [ "${{ inputs.install-from }}" = "pypi" ]; then
          pip install --disable-pip-version-check "codit-guard==${{ inputs.version }}"
        else
          pip install --disable-pip-version-check \
            "git+https://github.com/jbhavya876/CODIT.git@${{ inputs.repo-ref }}#subdirectory=packages/codit_core" \
            "git+https://github.com/jbhavya876/CODIT.git@${{ inputs.repo-ref }}#subdirectory=packages/codit_guard"
        fi

    - name: Run codit-guard check
      id: guard
      shell: bash
      continue-on-error: true
      run: |
        codit-guard check \
          --base "${{ github.event.pull_request.base.sha }}" \
          --head "${{ github.event.pull_request.head.sha }}" \
          --format sarif \
          --output codit.sarif \
          --fail-on "${{ inputs.fail-on }}"
        EXIT_CODE=$?
        echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
        echo "## CODIT Guard Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "- Scope: \`net\` (\`${{ github.event.pull_request.base.sha }}\`..\`${{ github.event.pull_request.head.sha }}\`)" >> "$GITHUB_STEP_SUMMARY"
        echo "- Exit status: \`${EXIT_CODE}\`" >> "$GITHUB_STEP_SUMMARY"
        exit "$EXIT_CODE"

    - name: Upload SARIF report
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles('codit.sarif') != '' && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.39.5 (v3)
      continue-on-error: true
      with:
        sarif_file: codit.sarif

    - name: Enforce guard exit code
      if: ${{ always() }}
      shell: bash
      run: exit "${{ steps.guard.outputs.exit_code }}"
