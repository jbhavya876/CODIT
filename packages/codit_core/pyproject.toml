[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codit-core"
version = "3.0.0"
description = "Pure static analysis core shared between CODIT server and codit-guard CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "license-expression>=30.0",
]

[project.urls]
Homepage = "https://github.com/jbhavya876/CODIT"
Repository = "https://github.com/jbhavya876/CODIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codit_core = ["*.yaml", "licenses/*.yaml", "licenses/canonical/*.txt"]
