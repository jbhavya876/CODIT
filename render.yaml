# Production deployment on Render (https://render.com)
# Unified single-service deployment: FastAPI serves the built React frontend directly.

services:
  - type: web
    name: codebase-audit-platform
    runtime: python
    plan: starter
    buildCommand: >-
      pip install -r backend/requirements.txt
      && npm --prefix frontend ci
      && npm --prefix frontend run build
    startCommand: cd backend && uvicorn run:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: GRAPH_BACKEND
        value: auto
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USERNAME
        value: cognodb
      - key: COGNODB_PASSWORD
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ROADMAP_MODEL
        value: claude-sonnet-5
      - key: OSV_API_URL
        value: https://api.osv.dev/v1/query
      - key: MAX_REPO_SIZE_MB
        value: "200"
      - key: MAX_FILE_COUNT
        value: "5000"
      - key: INGESTION_TIMEOUT_SECONDS
        value: "120"
      - key: REPORT_RETENTION_HOURS
        value: "24"
      - key: X402_FACILITATOR_URL
        value: https://facilitator.goplausible.xyz
      - key: X402_NETWORK
        value: algorand:wGHE2Pwdvd7S12BL5FaOP20EGYesN73ktiC1qzkkit8=
      - key: X402_ASSET
        value: "31566704"
      - key: X402_AMOUNT
        value: "150000"
      - key: X402_DECIMALS
        value: "6"
      - key: X402_MAX_TIMEOUT_SECONDS
        value: "120"
      - key: X402_PAY_TO
        sync: false
      - key: X402_FEE_PAYER
        sync: false
      - key: X402_RESOURCE_URL
        sync: false
