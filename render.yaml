# Production deployment on Render (https://render.com)
# Unified single-service deployment: FastAPI serves the built React frontend directly.

databases:
  - name: codit-postgres
    plan: starter

services:
  - type: web
    name: codebase-audit-platform
    runtime: python
    plan: starter
    buildCommand: >-
      pip install -r backend/requirements.txt
      && alembic -c backend/alembic.ini upgrade head
      && npm --prefix frontend ci
      && npm --prefix frontend run build
    startCommand: uvicorn backend.app:create_app --factory --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: codit-postgres
          property: connectionString
      - key: JOB_WORKERS
        value: "2"
      - key: GRAPH_BACKEND
        value: auto
      - key: AUDIT_RETENTION_HOURS
        value: "24"
      - key: STAGING_TTL_MINUTES
        value: "15"
      - key: ATTESTATION_RETENTION_DAYS
        value: "30"
      - key: ATTEST_TTL_DAYS
        value: "90"
      - key: ATTEST_SIGNING_KEY
        sync: false
      - key: ATTEST_KEY_ID
        value: "2026-12-a"
      - key: ADMIN_TOKEN
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://coditt.xyz
      - key: HISTORY_MAX_COMMITS
        value: "500"
      - key: HISTORY_MAX_DAYS
        value: "365"
      - key: HISTORY_MAX_FILES_PER_COMMIT
        value: "200"
      - key: HISTORY_MAX_BLOB_KB
        value: "1024"
      - key: HISTORY_TRANSFER_MAX_MB
        value: "200"
      - key: HISTORY_WALLTIME_SECONDS
        value: "120"
      - key: HISTORY_MEM_MB
        value: "1024"
      - key: DEPSDEV_BASE_URL
        value: https://api.deps.dev
      - key: LICENSE_LOOKUP_CONCURRENCY
        value: "8"
      - key: LICENSE_LOOKUP_BUDGET_SECONDS
        value: "25"
      - key: GITHUB_API_TOKEN
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EXEC_LLM_ENABLED
        value: "true"
      - key: OSV_API_URL
        value: https://api.osv.dev/v1/query
      - key: MAX_REPO_SIZE_MB
        value: "200"
      - key: MAX_FILE_COUNT
        value: "5000"
      - key: INGESTION_TIMEOUT_SECONDS
        value: "120"
      - key: X402_FACILITATOR_URL
        value: https://facilitator.goplausible.xyz
      - key: X402_NETWORK
        value: algorand:wGHE2Pwdvd7S12BL5FaOP20EGYesN73ktiC1qzkkit8=
      - key: X402_ASSET
        value: "31566704"
      - key: X402_AMOUNT
        value: "150000"
      - key: X402_DECIMALS
        value: "6"
      - key: X402_MAX_TIMEOUT_SECONDS
        value: "120"
      - key: X402_PAY_TO
        sync: false
      - key: X402_FEE_PAYER
        sync: false
      - key: X402_RESOURCE_URL
        sync: false
